name: Docs

on:
  push:
    branches: [master]
    paths:
      - 'docs/**'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'docs/**'
      - '.github/workflows/docs.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    name: Validate docs - ubuntu-latest

    steps:

    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Setup Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 24

    # Validates docs/ against the shared @fkrzski/docs-schema contract:
    # frontmatter (title + SEO-bounded description, project fields), markdownlint,
    # and internal-link resolution. Exits non-zero on any violation.
    # Bumped by hand: Dependabot doesn't read npx calls.
    - name: Validate docs
      run: npx --yes @fkrzski/docs-schema@0.2.0 docs
